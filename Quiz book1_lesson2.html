<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 1 - Lesson 2 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #012169;
    --blue: #3D6D9E;
    --light-blue: #EDF4FC;
    --blue-border: #A9C7E8;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--blue);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    border: 2px solid var(--navy);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--blue-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    border: 2px solid var(--blue-border);
    color: var(--navy);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--blue-border);
  }

  .option-pill.selected {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--blue-border);
    border-radius: 10px;
    color: var(--navy);
    background: var(--light-blue);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--blue);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 1 - Lesson 2 Quiz</h1>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

<script>
const quizData = {
  "lesson": 2,
  "title": "Book 1 - Lesson 2 Quiz",
  "sections": [
    {
      "name": "Vocabulary",
      "questions": [
        {
          "id": "q1",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'a doctor'?",
          "options": [
            "Um homem de negócios",
            "Crianças",
            "Adulto",
            "Um/a doutor/a"
          ],
          "correct": "Um/a doutor/a"
        },
        {
          "id": "q2",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'a businessman'?",
          "options": [
            "Um/a doutor/a",
            "Um carro",
            "Um homem de negócios",
            "Crianças"
          ],
          "correct": "Um homem de negócios"
        },
        {
          "id": "q3",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'children'?",
          "options": [
            "Um homem de negócios",
            "Adulto",
            "Um carro",
            "Crianças"
          ],
          "correct": "Crianças"
        },
        {
          "id": "q4",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'adult'?",
          "options": [
            "Um/a doutor/a",
            "Adulto",
            "Um carro",
            "Crianças"
          ],
          "correct": "Adulto"
        },
        {
          "id": "q5",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'a car'?",
          "options": [
            "Um carro",
            "Um homem de negócios",
            "Adulto",
            "Um/a doutor/a"
          ],
          "correct": "Um carro"
        }
      ]
    },
    {
      "name": "Reading: Mr & Mrs Potter",
      "questions": [
        {
          "id": "q6",
          "type": "multiple_choice",
          "prompt": "Mrs Potter is a doctor. Mr Potter is a businessman. What is Mrs Potter's job?",
          "options": [
            "Teacher",
            "Doctor",
            "Businessman"
          ],
          "correct": "Doctor"
        },
        {
          "id": "q7",
          "type": "multiple_choice",
          "prompt": "Mrs Potter is a doctor. Mr Potter is a businessman. What is Mr Potter's job?",
          "options": [
            "Businessman",
            "Teacher",
            "Doctor"
          ],
          "correct": "Businessman"
        },
        {
          "id": "q8",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly describes Mrs Potter using 'she'?",
          "options": [
            "She is a businessman.",
            "She is a doctor.",
            "He is a doctor."
          ],
          "correct": "She is a doctor."
        },
        {
          "id": "q9",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly describes Mr Potter using 'he'?",
          "options": [
            "He is a doctor.",
            "He is a businessman.",
            "She is a businessman."
          ],
          "correct": "He is a businessman."
        }
      ]
    },
    {
      "name": "Grammar: Negative Form of To Be",
      "questions": [
        {
          "id": "q10",
          "type": "fill_blank",
          "prompt": "I ______ a doctor.",
          "correct": [
            "am not",
            "'m not"
          ]
        },
        {
          "id": "q11",
          "type": "fill_blank",
          "prompt": "You ______ a businessman.",
          "correct": [
            "aren't",
            "are not"
          ]
        },
        {
          "id": "q12",
          "type": "fill_blank",
          "prompt": "He ______ a child.",
          "correct": [
            "isn't",
            "is not"
          ]
        },
        {
          "id": "q13",
          "type": "fill_blank",
          "prompt": "She ______ an adult.",
          "correct": [
            "isn't",
            "is not"
          ]
        },
        {
          "id": "q14",
          "type": "fill_blank",
          "prompt": "It ______ a car.",
          "correct": [
            "isn't",
            "is not"
          ]
        }
      ]
    },
    {
      "name": "Negative Contractions",
      "questions": [
        {
          "id": "q15",
          "type": "fill_blank",
          "prompt": "I am not → ______",
          "correct": [
            "I'm not"
          ]
        },
        {
          "id": "q16",
          "type": "fill_blank",
          "prompt": "You are not → ______",
          "correct": [
            "You aren't",
            "You're not"
          ]
        },
        {
          "id": "q17",
          "type": "fill_blank",
          "prompt": "He is not → ______",
          "correct": [
            "He isn't",
            "He's not"
          ]
        },
        {
          "id": "q18",
          "type": "fill_blank",
          "prompt": "She is not → ______",
          "correct": [
            "She isn't",
            "She's not"
          ]
        },
        {
          "id": "q19",
          "type": "fill_blank",
          "prompt": "It is not → ______",
          "correct": [
            "It isn't",
            "It's not"
          ]
        }
      ]
    },
    {
      "name": "Pronouns & Possessive Adjectives",
      "questions": [
        {
          "id": "q20",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'I'?",
          "correct": [
            "my"
          ]
        },
        {
          "id": "q21",
          "type": "fill_blank",
          "prompt": "What is the subject pronoun that matches the possessive adjective 'your'?",
          "correct": [
            "you"
          ]
        },
        {
          "id": "q22",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'he'?",
          "correct": [
            "his"
          ]
        },
        {
          "id": "q23",
          "type": "fill_blank",
          "prompt": "What is the subject pronoun that matches the possessive adjective 'her'?",
          "correct": [
            "she"
          ]
        },
        {
          "id": "q24",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'it'?",
          "correct": [
            "its"
          ]
        }
      ]
    },
    {
      "name": "Possessive Adjectives: Fill in the Blank",
      "questions": [
        {
          "id": "q25",
          "type": "fill_blank",
          "prompt": "Tom has a dog. This is ______ dog.",
          "correct": [
            "his"
          ]
        },
        {
          "id": "q26",
          "type": "fill_blank",
          "prompt": "I have a car. This is ______ car.",
          "correct": [
            "my"
          ]
        },
        {
          "id": "q27",
          "type": "fill_blank",
          "prompt": "Amy has a house. This is ______ house.",
          "correct": [
            "her"
          ]
        },
        {
          "id": "q28",
          "type": "fill_blank",
          "prompt": "You have a name. What is ______ name?",
          "correct": [
            "your"
          ]
        },
        {
          "id": "q29",
          "type": "fill_blank",
          "prompt": "Spot is a dog. ______ name is Spot.",
          "correct": [
            "Its",
            "its"
          ]
        }
      ]
    },
    {
      "name": "Names Vocabulary",
      "questions": [
        {
          "id": "q30",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'first name'?",
          "options": [
            "Sobrenome",
            "Segundo nome",
            "Nome"
          ],
          "correct": "Nome"
        },
        {
          "id": "q31",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'second name'?",
          "options": [
            "Segundo nome",
            "Sobrenome",
            "Nome"
          ],
          "correct": "Segundo nome"
        },
        {
          "id": "q32",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'surname'?",
          "options": [
            "Sobrenome",
            "Segundo nome",
            "Nome"
          ],
          "correct": "Sobrenome"
        }
      ]
    },
    {
      "name": "Asking About Names",
      "questions": [
        {
          "id": "q33",
          "type": "fill_blank",
          "prompt": "Translate into English: 'Qual é o seu nome?'",
          "correct": [
            "What's your name?",
            "What is your name?"
          ]
        },
        {
          "id": "q34",
          "type": "fill_blank",
          "prompt": "Translate into English: 'Qual é o nome dele?'",
          "correct": [
            "What's his name?",
            "What is his name?"
          ]
        },
        {
          "id": "q35",
          "type": "fill_blank",
          "prompt": "Translate into English: 'Qual é o nome dela?'",
          "correct": [
            "What's her name?",
            "What is her name?"
          ]
        }
      ]
    },
    {
      "name": "Review",
      "questions": [
        {
          "id": "q36",
          "type": "multiple_choice",
          "prompt": "Which statement correctly describes the difference between 'first name' and 'surname'?",
          "options": [
            "First name is the family name; surname is the personal name given at birth.",
            "They mean the same thing.",
            "First name is the personal name given at birth; surname is the family name."
          ],
          "correct": "First name is the personal name given at birth; surname is the family name."
        },
        {
          "id": "q37",
          "type": "multiple_choice",
          "prompt": "Which pair correctly matches a subject pronoun with its possessive adjective?",
          "options": [
            "She → His",
            "It → My",
            "He → His",
            "He → Her"
          ],
          "correct": "He → His"
        }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    if (section.note) {
      const note = document.createElement('div');
      note.className = 'instructions';
      note.style.marginBottom = '16px';
      note.textContent = section.note;
      sectionDiv.appendChild(note);
    }

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
