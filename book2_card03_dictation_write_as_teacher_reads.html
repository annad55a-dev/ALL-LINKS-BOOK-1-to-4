<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Write as the Teacher Reads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #8B6F14;
    --accent: #B8941F;
    --light: #FFF8E1;
    --border: #E8C547;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Baloo 2', sans-serif;
    background: #fff;
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);
  }
  .card-container { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 1.4rem;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .card {
    background: var(--light);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 22px 28px;
  }
  .subtitle { font-weight: 700; color: var(--navy); font-size: 0.95rem; margin: 0 0 14px; text-align:center; }
  .rule-list { margin: 0 0 16px; padding-left: 20px; }
  .rule-list li { font-weight: 700; color: var(--navy); font-size: 0.88rem; margin-bottom: 4px; }
  .two-col { display: flex; gap: 28px; }
  .col { flex: 1; }
  .col.split { border-right: 2px solid var(--border); padding-right: 28px; }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: center;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--navy);
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border);
  }
  td {
    text-align: center;
    padding: 9px 4px;
    font-weight: 700;
    color: var(--navy);
    font-size: 0.9rem;
  }
  td.accent { color: var(--accent); }
  .prompt-list p {
    font-weight: 700;
    color: var(--navy);
    font-size: 0.95rem;
    margin: 14px 0 4px;
  }
  input.blank, textarea.blank, select.blank {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    min-width: 80px;
    max-width: 220px;
    padding: 6px 8px;
    font-size: 0.85rem;
    border: none;
    border-bottom: 2px solid var(--border);
    background: transparent;
    text-align: center;
    color: var(--navy);
    font-weight: 700;
  }
  input.blank:focus, textarea.blank:focus, select.blank:focus { outline: none; border-bottom-color: var(--accent); }
  input.blank.correct, textarea.blank.correct, select.blank.correct { color: var(--correct-fg); border-bottom-color: var(--correct-fg); }
  input.blank.incorrect, textarea.blank.incorrect, select.blank.incorrect { color: var(--incorrect-fg); border-bottom-color: var(--incorrect-fg); }
  input.line {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    padding: 6px 8px;
    font-size: 0.9rem;
    border: none;
    border-bottom: 2px solid var(--border);
    background: transparent;
    color: var(--navy);
    font-weight: 600;
  }
  input.line:focus { outline: none; border-bottom-color: var(--accent); }
  input.line.correct { color: var(--correct-fg); border-bottom-color: var(--correct-fg); }
  input.line.incorrect { color: var(--incorrect-fg); border-bottom-color: var(--incorrect-fg); }
  .sentence-item { margin-bottom: 14px; }
  .sentence-item .given { font-weight: 700; color: var(--navy); font-size: 0.95rem; margin-bottom: 4px; }
  .controls { display: flex; justify-content: center; gap: 16px; margin-top: 26px; }
  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 10px 26px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
  }
  button.reset-btn { background: var(--accent); }
  button.action-btn:hover { opacity: 0.9; }
  #score-summary { text-align: center; font-weight: 700; font-size: 1.05rem; margin-top: 18px; color: var(--navy); }
  @media (max-width: 640px) {
    .two-col { flex-direction: column; }
    .col.split { border-right: none; border-bottom: 2px solid var(--border); padding-right: 0; padding-bottom: 18px; }
    th, td { font-size: 0.75rem; }
  }

.answer-reveal {
  display: inline-block;
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 0.78rem;
  color: var(--correct-fg);
  background: var(--correct-bg);
  border: 1px solid var(--correct-fg);
  border-radius: 6px;
  padding: 1px 7px;
  margin-left: 6px;
  white-space: nowrap;
}
.answer-reveal::before { content: "\2713 "; }
td .answer-reveal { display: block; margin: 3px 0 0; }
</style>
</head>
<body>
<div class="card-container">
  <h1>Write as the Teacher Reads</h1>
  <div class="card">
<div style="margin:14px 0;"><input class="line"></div><div style="margin:14px 0;"><input class="line"></div><div style="margin:14px 0;"><input class="line"></div><div style="margin:14px 0;"><input class="line"></div><div style="margin:14px 0;"><input class="line"></div><div style="margin:14px 0;"><input class="line"></div><div style="margin:14px 0;"><input class="line"></div>
<p style="font-size:0.8rem; color:var(--accent); font-style:italic; margin-top:14px;">Free practice space — not graded (depends on live dictation).</p>
  </div>

  <div class="controls">
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

</div>
<script>
document.getElementById('reset-btn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
