<style>

    --light: #EDF4FC;

  body {
    font-family: 'Baloo 2', sans-serif;
    background: #fff;

    padding: 24px 16px 60px;

    color: var(--navy);
    font-weight: 700;

    border: 2px solid var(--border);

    cursor: pointer;
    color: #fff;
    background: var(--navy);
    display: inline-flex;
    align-items: center;
    gap: 8px;

  button.play-btn svg { width: 18px; height: 18px; fill: #fff; }

    width: 100%;
    max-width: 360px;
    accent-color: var(--navy);
