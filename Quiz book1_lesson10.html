<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 1 - Lesson 10 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #012169;
    --blue: #3D6D9E;
    --light-blue: #EDF4FC;
    --blue-border: #A9C7E8;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--blue);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    border: 2px solid var(--navy);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--blue-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    border: 2px solid var(--blue-border);
    color: var(--navy);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--blue-border);
  }

  .option-pill.selected {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--blue-border);
    border-radius: 10px;
    color: var(--navy);
    background: var(--light-blue);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--blue);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 1 - Lesson 10 Quiz</h1>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

<script>
const quizData = {
  "lesson": 10,
  "title": "Book 1 - Lesson 10 Quiz",
  "sections": [
    {
      "name": "Ask, Answer, Question Vocabulary",
      "questions": [
        {
          "id": "q1",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Perguntar'?",
          "correct": [
            "Ask"
          ]
        },
        {
          "id": "q2",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Responder/resposta'?",
          "correct": [
            "Answer"
          ]
        },
        {
          "id": "q3",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Pergunta'?",
          "correct": [
            "Question"
          ]
        }
      ]
    },
    {
      "name": "Question or Answer?",
      "questions": [
        {
          "id": "q4",
          "type": "multiple_choice",
          "prompt": "Is 'What colour is your shirt?' a question or an answer?",
          "options": [
            "Answer",
            "Question"
          ],
          "correct": "Question"
        },
        {
          "id": "q5",
          "type": "multiple_choice",
          "prompt": "Is 'My shirt is blue' a question or an answer?",
          "options": [
            "Answer",
            "Question"
          ],
          "correct": "Answer"
        },
        {
          "id": "q6",
          "type": "multiple_choice",
          "prompt": "When you ask someone something, are you asking a question or giving an answer?",
          "options": [
            "Answer",
            "Question"
          ],
          "correct": "Question"
        }
      ]
    },
    {
      "name": "Where, To, Money & Countries Vocabulary",
      "questions": [
        {
          "id": "q7",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'where'?",
          "options": [
            "Inglaterra",
            "Onde",
            "Para",
            "Dinheiro"
          ],
          "correct": "Onde"
        },
        {
          "id": "q8",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'to'?",
          "options": [
            "China",
            "Dinheiro",
            "Para",
            "Onde"
          ],
          "correct": "Para"
        },
        {
          "id": "q9",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'money'?",
          "options": [
            "Onde",
            "Inglaterra",
            "China",
            "Dinheiro"
          ],
          "correct": "Dinheiro"
        },
        {
          "id": "q10",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'England'?",
          "options": [
            "Rússia",
            "Inglaterra",
            "Dinheiro",
            "China"
          ],
          "correct": "Inglaterra"
        },
        {
          "id": "q11",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'China'?",
          "options": [
            "Rússia",
            "Para",
            "Inglaterra",
            "China"
          ],
          "correct": "China"
        },
        {
          "id": "q12",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'Russia'?",
          "options": [
            "Rússia",
            "Inglaterra",
            "Líder russo",
            "China"
          ],
          "correct": "Rússia"
        },
        {
          "id": "q13",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'Putin'?",
          "options": [
            "Inglaterra",
            "Rússia",
            "China",
            "Líder russo"
          ],
          "correct": "Líder russo"
        }
      ]
    },
    {
      "name": "Complete with the Correct Country",
      "questions": [
        {
          "id": "q18",
          "type": "fill_blank",
          "prompt": "Complete the contraction: I ______ from England.",
          "correct": [
            "'m"
          ]
        },
        {
          "id": "q19",
          "type": "fill_blank",
          "prompt": "Complete the contraction: Ming ______ from China.",
          "correct": [
            "'s"
          ]
        },
        {
          "id": "q20",
          "type": "fill_blank",
          "prompt": "Complete the contraction: Putin ______ from Russia.",
          "correct": [
            "'s"
          ]
        }
      ]
    },
    {
      "name": "Look, Look At & Next To Vocabulary",
      "questions": [
        {
          "id": "q21",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Olhar'?",
          "correct": [
            "Look"
          ]
        },
        {
          "id": "q22",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Olhar para'?",
          "correct": [
            "Look at"
          ]
        },
        {
          "id": "q23",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Ao lado de'?",
          "correct": [
            "Next to"
          ]
        }
      ]
    },
    {
      "name": "Prepositions of Place Vocabulary",
      "questions": [
        {
          "id": "q24",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Na frente de'?",
          "correct": [
            "In front of"
          ]
        },
        {
          "id": "q25",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Atrás'?",
          "correct": [
            "Behind"
          ]
        },
        {
          "id": "q26",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Ao lado de'?",
          "correct": [
            "Next to"
          ]
        },
        {
          "id": "q27",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Embaixo'?",
          "correct": [
            "Under"
          ]
        },
        {
          "id": "q28",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Caderno'?",
          "correct": [
            "Notebook"
          ]
        }
      ]
    },
    {
      "name": "Complete with the Correct Preposition",
      "questions": [
        {
          "id": "q33",
          "type": "fill_blank",
          "prompt": "The pen's ______ the notebook.",
          "correct": [
            "on"
          ]
        },
        {
          "id": "q34",
          "type": "fill_blank",
          "prompt": "The notebook's ______ the table.",
          "correct": [
            "on"
          ]
        },
        {
          "id": "q35",
          "type": "fill_blank",
          "prompt": "The notebook's ______ the chair.",
          "correct": [
            "under"
          ]
        },
        {
          "id": "q36",
          "type": "fill_blank",
          "prompt": "The wall's ______ me.",
          "correct": [
            "behind"
          ]
        },
        {
          "id": "q37",
          "type": "fill_blank",
          "prompt": "The window's ______ you.",
          "correct": [
            "behind"
          ]
        }
      ]
    },
    {
      "name": "Review",
      "questions": [
        {
          "id": "q38",
          "type": "multiple_choice",
          "prompt": "Which of these is a correctly matched question-and-answer pair?",
          "options": [
            "Both are questions.",
            "'What colour is your shirt?' — 'My shirt is blue.'",
            "'My shirt is blue.' — 'What colour is your shirt?'"
          ],
          "correct": "'What colour is your shirt?' — 'My shirt is blue.'"
        },
        {
          "id": "q39",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly uses a preposition of place from this unit?",
          "options": [
            "The book next to is my bed.",
            "Next my bed the book is.",
            "The book is next to my bed."
          ],
          "correct": "The book is next to my bed."
        }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    if (section.note) {
      const note = document.createElement('div');
      note.className = 'instructions';
      note.style.marginBottom = '16px';
      note.textContent = section.note;
      sectionDiv.appendChild(note);
    }

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
