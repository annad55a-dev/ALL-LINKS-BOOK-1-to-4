<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 2 - Lesson 1 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #37016A;
    --blue: #6B3FA0;
    --light-blue: #F3EAFB;
    --blue-border: #C7A9E8;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--blue);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    border: 2px solid var(--navy);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--blue-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    border: 2px solid var(--blue-border);
    color: var(--navy);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--blue-border);
  }

  .option-pill.selected {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--blue-border);
    border-radius: 10px;
    color: var(--navy);
    background: var(--light-blue);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--blue);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 2 - Lesson 1 Quiz</h1>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

<script>
const quizData = {
  "lesson": 1,
  "title": "Book 2 - Lesson 1 Quiz",
  "sections": [
    {
      "name": "Flat, Flatmate & Housemate Vocabulary",
      "questions": [
        {
          "id": "q1",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Apartamento'?",
          "correct": [
            "Flat"
          ]
        },
        {
          "id": "q2",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Companheiro de flat'?",
          "correct": [
            "Flatmate"
          ]
        },
        {
          "id": "q3",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Companheiro de casa'?",
          "correct": [
            "Housemate"
          ]
        }
      ]
    },
    {
      "name": "Reading: Text 1",
      "questions": [
        {
          "id": "q4",
          "type": "fill_blank",
          "prompt": "Madonna's a famous singer. What is Madonna's job?",
          "correct": [
            "Singer",
            "She's a singer."
          ]
        },
        {
          "id": "q5",
          "type": "fill_blank",
          "prompt": "She lives in New York. Where does Madonna live?",
          "correct": [
            "New York"
          ]
        },
        {
          "id": "q6",
          "type": "fill_blank",
          "prompt": "She lives near Bono and Al Pacino. Who does Madonna live near?",
          "correct": [
            "Bono and Al Pacino"
          ]
        },
        {
          "id": "q7",
          "type": "multiple_choice",
          "prompt": "Madonna and Al Pacino live in New York, but they aren't friends. Are Madonna and Al Pacino friends?",
          "options": [
            "Yes, they are.",
            "No, they aren't."
          ],
          "correct": "No, they aren't."
        }
      ]
    },
    {
      "name": "Same & Different Vocabulary",
      "questions": [
        {
          "id": "q8",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'O mesmo / a mesma'?",
          "correct": [
            "The same"
          ]
        },
        {
          "id": "q9",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'O mesmo que'?",
          "correct": [
            "The same as"
          ]
        },
        {
          "id": "q10",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Dormir'?",
          "correct": [
            "Sleep"
          ]
        },
        {
          "id": "q11",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Diferente'?",
          "correct": [
            "Different"
          ]
        },
        {
          "id": "q12",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Diferente de'?",
          "correct": [
            "Different from"
          ]
        }
      ]
    },
    {
      "name": "Size, Enemies & Neighbours Vocabulary",
      "questions": [
        {
          "id": "q13",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Grande'?",
          "correct": [
            "Large"
          ]
        },
        {
          "id": "q14",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Pequeno'?",
          "correct": [
            "Small"
          ]
        },
        {
          "id": "q15",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Inimigo'?",
          "correct": [
            "Enemy"
          ]
        },
        {
          "id": "q16",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Inimigos'?",
          "correct": [
            "Enemies"
          ]
        },
        {
          "id": "q17",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Vizinhos'?",
          "correct": [
            "Neighbours"
          ]
        }
      ]
    },
    {
      "name": "Weather Vocabulary",
      "questions": [
        {
          "id": "q18",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'What's ... like?'",
          "options": [
            "Nublado",
            "Como é / está ...?",
            "Hoje",
            "Tempo"
          ],
          "correct": "Como é / está ...?"
        },
        {
          "id": "q19",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'today'?",
          "options": [
            "Chuvoso",
            "Hoje",
            "Tempo",
            "Ensolarado"
          ],
          "correct": "Hoje"
        },
        {
          "id": "q20",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'weather'?",
          "options": [
            "Hoje",
            "Chuvoso",
            "Tempo",
            "Nublado"
          ],
          "correct": "Tempo"
        },
        {
          "id": "q21",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'cloudy'?",
          "options": [
            "Chuvoso",
            "Tempo",

            "Nublado"
          ],
          "correct": "Nublado"
        },
        {
          "id": "q22",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'sunny'?",
          "options": [
            "Nublado",
            "Ensolarado",
            "Hoje",
            "Chuvoso"
          ],
          "correct": "Ensolarado"
        },
        {
          "id": "q23",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'rainy'?",
          "options": [
            "Chuvoso",
            "Nublado",
            "Como é / está ...?",
            "Ensolarado"
          ],
          "correct": "Chuvoso"
        }
      ]
    },
    {
      "name": "Reading: Text 2",
      "questions": [
        {
          "id": "q24",
          "type": "fill_blank",
          "prompt": "Caroline and Emma are friends and housemates. What is the relationship between Caroline and Emma?",
          "correct": [
            "They are friends and housemates."
          ]
        },
        {
          "id": "q25",
          "type": "multiple_choice",
          "prompt": "Their house's large and beautiful. Is Caroline and Emma's house large or small?",
          "options": [
            "Small",
            "Large"
          ],
          "correct": "Large"
        },
        {
          "id": "q26",
          "type": "fill_blank",
          "prompt": "Peter and Jack live in the same flat. What is the relationship between Peter and Jack?",
          "correct": [
            "They are flatmates."
          ]
        },
        {
          "id": "q27",
          "type": "multiple_choice",
          "prompt": "They're flatmates, but they sleep in different rooms. Do Peter and Jack sleep in the same room?",
          "options": [
            "Yes, they sleep in the same room.",
            "No, they sleep in different rooms."
          ],
          "correct": "No, they sleep in different rooms."
        },
        {
          "id": "q28",
          "type": "multiple_choice",
          "prompt": "Their flat's small, but beautiful. Is Peter and Jack's flat large or small?",
          "options": [
            "Small",
            "Large"
          ],
          "correct": "Small"
        }
      ]
    },
    {
      "name": "Prepositions & Household Vocabulary",
      "questions": [
        {
          "id": "q29",
          "type": "fill_blank",
          "prompt": "What is the English preposition for 'No / Na' (location)?",
          "correct": [
            "At"
          ]
        },
        {
          "id": "q30",
          "type": "fill_blank",
          "prompt": "What is the English preposition for 'No / Na / Dentro'?",
          "correct": [
            "In"
          ]
        },
        {
          "id": "q31",
          "type": "fill_blank",
          "prompt": "What is the English preposition for 'No / Na / Sobre'?",
          "correct": [
            "On"
          ]
        },
        {
          "id": "q32",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Vir'?",
          "correct": [
            "Come"
          ]
        },
        {
          "id": "q33",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Teto'?",
          "correct": [
            "Ceiling"
          ]
        },
        {
          "id": "q34",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Ventilador'?",
          "correct": [
            "Fan"
          ]
        },
        {
          "id": "q35",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Luz / Lâmpada'?",
          "correct": [
            "Light"
          ]
        },
        {
          "id": "q36",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Vir para'?",
          "correct": [
            "Come to"
          ]
        },
        {
          "id": "q37",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Ir para'?",
          "correct": [
            "Go to"
          ]
        }
      ]
    },
    {
      "name": "Review",
      "questions": [
        {
          "id": "q42",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly describes today's weather?",
          "options": [
            "Today it sunny is.",
            "It's today sunny.",
            "Today it's sunny."
          ],
          "correct": "Today it's sunny."
        },
        {
          "id": "q43",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly compares two things using 'different from'?",
          "options": [
            "Different my flat is from yours.",
            "My flat is different from yours.",
            "My flat different is from yours."
          ],
          "correct": "My flat is different from yours."
        }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
