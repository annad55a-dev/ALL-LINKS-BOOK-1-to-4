<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 2 - Lesson 12 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #37016A;
    --blue: #6B3FA0;
    --light-blue: #F3EAFB;
    --blue-border: #C7A9E8;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--blue);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    border: 2px solid var(--navy);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--blue-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    border: 2px solid var(--blue-border);
    color: var(--navy);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--blue-border);
  }

  .option-pill.selected {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--blue-border);
    border-radius: 10px;
    color: var(--navy);
    background: var(--light-blue);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--blue);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 2 - Lesson 12 Quiz</h1>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

<script>
const quizData = {
  "lesson": 12,
  "title": "Book 2 - Lesson 12 Quiz",
  "sections": [
    {
      "name": "There Is / There Are: Negative and Question Practice",
      "questions": [
        {
          "id": "q1",
          "type": "fill_blank",
          "prompt": "Write the negative form: 'There's a flag at the top of the building.'",
          "correct": [
            "There isn't a flag at the top of the building."
          ]
        },
        {
          "id": "q2",
          "type": "fill_blank",
          "prompt": "Write the question form: 'There's a flag at the top of the building.'",
          "correct": [
            "Is there a flag at the top of the building?"
          ]
        },
        {
          "id": "q3",
          "type": "fill_blank",
          "prompt": "Write the negative form: 'There are two policemen on each corner.'",
          "correct": [
            "There aren't two policemen on each corner."
          ]
        },
        {
          "id": "q4",
          "type": "fill_blank",
          "prompt": "Write the question form: 'There are two policemen on each corner.'",
          "correct": [
            "Are there two policemen on each corner?"
          ]
        }
      ]
    },
    {
      "name": "Seasons of the Year Vocabulary",
      "questions": [
        {
          "id": "q11",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Estações do ano'?",
          "correct": [
            "Seasons of the year"
          ]
        },
        {
          "id": "q12",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Primavera'?",
          "correct": [
            "Spring"
          ]
        },
        {
          "id": "q13",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Verão'?",
          "correct": [
            "Summer"
          ]
        },
        {
          "id": "q14",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Outono'?",
          "correct": [
            "Autumn",
            "Fall"
          ]
        },
        {
          "id": "q15",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Inverno'?",
          "correct": [
            "Winter"
          ]
        },
        {
          "id": "q16",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Temporada/período'?",
          "correct": [
            "Season"
          ]
        },
        {
          "id": "q17",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Morno'?",
          "correct": [
            "Warm"
          ]
        },
        {
          "id": "q18",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Fresco'?",
          "correct": [
            "Cool"
          ]
        },
        {
          "id": "q19",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Sempre'?",
          "correct": [
            "Always"
          ]
        },
        {
          "id": "q20",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Inseto'?",
          "correct": [
            "Insect"
          ]
        }
      ]
    },
    {
      "name": "Hunting Season Vocabulary",
      "questions": [
        {
          "id": "q25",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Caçar'?",
          "correct": [
            "Hunt"
          ]
        },
        {
          "id": "q26",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Temporada de caça'?",
          "correct": [
            "Hunting season"
          ]
        },
        {
          "id": "q27",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Designado'?",
          "correct": [
            "Designated"
          ]
        },
        {
          "id": "q28",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Animais caçados por recreação/consumo'?",
          "correct": [
            "Game"
          ]
        },
        {
          "id": "q29",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Certa/o; Determinados'?",
          "correct": [
            "Certain"
          ]
        },
        {
          "id": "q30",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Matar'?",
          "correct": [
            "Kill"
          ]
        },
        {
          "id": "q31",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Matou'?",
          "correct": [
            "Killed"
          ]
        }
      ]
    },
    {
      "name": "Mixed Review: There Is / There Are",
      "questions": [
        {
          "id": "q35",
          "type": "fill_blank",
          "prompt": "______ four seasons in a year.",
          "correct": [
            "There are"
          ]
        },
        {
          "id": "q36",
          "type": "fill_blank",
          "prompt": "Rewrite as a negative: 'There are four seasons in a year.'",
          "correct": [
            "There aren't four seasons in a year."
          ]
        },
        {
          "id": "q37",
          "type": "fill_blank",
          "prompt": "______ many insects in the summer.",
          "correct": [
            "There are"
          ]
        },
        {
          "id": "q38",
          "type": "fill_blank",
          "prompt": "Rewrite as a negative: 'There are many insects in the summer.'",
          "correct": [
            "There aren't many insects in the summer."
          ]
        },
        {
          "id": "q39",
          "type": "fill_blank",
          "prompt": "______ a designated hunting season in this area.",
          "correct": [
            "There is"
          ]
        },
        {
          "id": "q40",
          "type": "fill_blank",
          "prompt": "Rewrite as a negative: 'There is a designated hunting season in this area.'",
          "correct": [
            "There isn't a designated hunting season in this area."
          ]
        }
      ]
    },
    {
      "name": "Review",
      "questions": [
        {
          "id": "q41",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly expresses a season preference with a reason?",
          "options": [
            "I like summer best it's warm and sunny because.",
            "Summer I like best because warm and sunny it's.",
            "I like summer best because it's warm and sunny."
          ],
          "correct": "I like summer best because it's warm and sunny."
        },
        {
          "id": "q42",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly uses 'there are' about the seasons?",
          "options": [
            "There are four season in a year.",
            "Four there are seasons in a year.",
            "There are four seasons in a year."
          ],
          "correct": "There are four seasons in a year."
        }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
