<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 1 - Lesson 5 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #012169;
    --blue: #3D6D9E;
    --light-blue: #EDF4FC;
    --blue-border: #A9C7E8;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--blue);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    border: 2px solid var(--navy);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--blue-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    border: 2px solid var(--blue-border);
    color: var(--navy);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--blue-border);
  }

  .option-pill.selected {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--blue-border);
    border-radius: 10px;
    color: var(--navy);
    background: var(--light-blue);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--blue);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 1 - Lesson 5 Quiz</h1>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

<script>
const quizData = {
  "lesson": 5,
  "title": "Book 1 - Lesson 5 Quiz",

    {

          "prompt": "What is the possessive adjective for the subject pronoun 'You'?",
          "correct": [
            "your"
          ]
        },
        {
          "id": "q3",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'He'?",
          "correct": [
            "his"
          ]
        },
        {
          "id": "q4",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'She'?",
          "correct": [
            "her"
          ]
        },
        {
          "id": "q5",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'It'?",
          "correct": [
            "its"
          ]
        },
        {
          "id": "q6",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'We'?",
          "correct": [
            "our"
          ]
        },
        {
          "id": "q7",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'You (plural)'?",
          "correct": [
            "your"
          ]
        },
        {
          "id": "q8",
          "type": "fill_blank",
          "prompt": "What is the possessive adjective for the subject pronoun 'They'?",
          "correct": [
            "their"
          ]
        }
      ]
    },
    {
      "name": "Possessive Adjectives: Fill in the Blank",
      "questions": [
        {
          "id": "q9",
          "type": "fill_blank",
          "prompt": "We have a car. This is ______ car.",
          "correct": [
            "our"
          ]
        },
        {
          "id": "q10",
          "type": "fill_blank",
          "prompt": "They have pets. These are ______ pets.",
          "correct": [
            "their"
          ]
        },
        {
          "id": "q11",
          "type": "fill_blank",
          "prompt": "Mr Potter has a name. This is ______ name.",
          "correct": [
            "his"
          ]
        },
        {
          "id": "q12",
          "type": "fill_blank",
          "prompt": "Mrs Potter and Mr Potter have children. These are ______ children.",
          "correct": [
            "their"
          ]
        },
        {
          "id": "q13",
          "type": "fill_blank",
          "prompt": "You (plural) have a classroom. This is ______ classroom.",
          "correct": [
            "your"
          ]
        }
      ]
    },
    {
      "name": "Personal Items Vocabulary",
      "questions": [
        {
          "id": "q14",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'bag'?",
          "options": [
            "Bolsa",
            "Celular",
            "Óculos",
            "Carteira"
          ],
          "correct": "Bolsa"
        },
        {
          "id": "q15",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'mobile phone'?",
          "options": [
            "Chinelo",
            "Carteira",
            "Celular",
            "Bolsa"
          ],
          "correct": "Celular"
        },
        {
          "id": "q16",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'glasses'?",
          "options": [
            "Celular",
            "Óculos",
            "Chinelo",
            "Carteira"
          ],
          "correct": "Óculos"
        },
        {
          "id": "q17",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'wallet'?",
          "options": [
            "Óculos",
            "Bolsa",
            "Carteira",
            "Chinelo"
          ],
          "correct": "Carteira"
        },
        {
          "id": "q18",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'flip-flops'?",
          "options": [
            "Bolsa",
            "Carteira",
            "Óculos",
            "Chinelo"
          ],
          "correct": "Chinelo"
        }
      ]
    },
    {
      "name": "Clothing & Everyday Words",
      "questions": [
        {
          "id": "q19",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Calça jeans'?",
          "correct": [
            "Jeans"
          ]
        },
        {
          "id": "q20",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Vestido'?",
          "correct": [
            "Dress"
          ]
        },
        {
          "id": "q21",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Avental'?",
          "correct": [
            "Apron"
          ]
        },
        {
          "id": "q22",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Sapato' (singular)?",
          "correct": [
            "Shoe"
          ]
        },
        {
          "id": "q23",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Sapatos' (plural)?",
          "correct": [
            "Shoes"
          ]
        },
        {
          "id": "q24",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Tênis' (singular)?",
          "correct": [
            "Trainer"
          ]
        },
        {
          "id": "q25",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Tênis' (plural)?",
          "correct": [
            "Trainers"
          ]
        }
      ]
    },
    {
      "name": "This / That / These / Those",
      "questions": [
        {
          "id": "q26",
          "type": "fill_blank",
          "prompt": "______ is my pen (near me, singular).",
          "correct": [
            "This"
          ]
        },
        {
          "id": "q27",
          "type": "fill_blank",
          "prompt": "______ is your pen (far from me, singular).",
          "correct": [
            "That"
          ]
        },
        {
          "id": "q28",
          "type": "fill_blank",
          "prompt": "______ are my books (near me, plural).",
          "correct": [
            "These"
          ]
        },
        {
          "id": "q29",
          "type": "fill_blank",
          "prompt": "______ are your books (far from me, plural).",
          "correct": [
            "Those"
          ]
        }
      ]
    },
    {
      "name": "Reading: Text 1",
      "questions": [
        {
          "id": "q30",
          "type": "multiple_choice",
          "prompt": "These are Mr and Mrs Potter and these are their children. Mr Potter is a businessman and Mrs Potter is a doctor. These are Hannah, Amy and John. What is Mr Potter's job?",
          "options": [
            "Businessman",
            "Doctor",
            "Teacher"
          ],
          "correct": "Businessman"
        },
        {
          "id": "q31",
          "type": "multiple_choice",
          "prompt": "What is Mrs Potter's job?",
          "options": [
            "Businessman",
            "Doctor",
            "Teacher"
          ],
          "correct": "Doctor"
        },
        {
          "id": "q32",
          "type": "multiple_choice",
          "prompt": "Name the three children.",
          "options": [
            "Hannah, Amy and John",
            "Amy, John and Spot",
            "Hannah, John and Potter"
          ],
          "correct": "Hannah, Amy and John"
        },
        {
          "id": "q33",
          "type": "multiple_choice",
          "prompt": "Whose pets are they?",
          "options": [
            "Mr and Mrs Potter's pets",
            "The children's pets",
            "The neighbour's pets"
          ],
          "correct": "Mr and Mrs Potter's pets"
        },
        {
          "id": "q34",
          "type": "fill_blank",
          "prompt": "Rewrite using a possessive adjective: 'Mr Potter is a businessman.' → '______ job is businessman.'",
          "correct": [
            "His"
          ]
        }
      ]
    },
    {
      "name": "People Vocabulary",
      "questions": [
        {
          "id": "q35",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'man'?",
          "options": [
            "Homem",
            "Mulher",
            "Menino",
            "Menina"
          ],
          "correct": "Homem"
        },
        {
          "id": "q36",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'woman'?",
          "options": [
            "Menina",
            "Mulher",
            "Homem",
            "Menino"
          ],
          "correct": "Mulher"
        },
        {
          "id": "q37",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'boy'?",
          "options": [
            "Mulher",
            "Homem",
            "Menino",
            "Menina"
          ],
          "correct": "Menino"
        },
        {
          "id": "q38",
          "type": "multiple_choice",
          "prompt": "What is the Portuguese translation of 'girl'?",
          "options": [
            "Menino",
            "Menina",
            "Mulher",
            "Homem"
          ],
          "correct": "Menina"
        }
      ]
    },
    {
      "name": "Review",
      "questions": [
        {
          "id": "q39",
          "type": "multiple_choice",
          "prompt": "Which statement correctly explains the difference between 'this/that' and 'these/those'?",
          "options": [
            "'This/that' are singular (this = near, that = far); 'these/those' are plural (these = near, those = far).",
            "'This/that' are plural; 'these/those' are singular.",
            "There is no difference; they can be used interchangeably."
          ],
          "correct": "'This/that' are singular (this = near, that = far); 'these/those' are plural (these = near, those = far)."
        },
        {
          "id": "q40",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly uses a possessive adjective to describe a family member?",
          "options": [
            "Her name is Amy.",
            "She name is Amy.",
            "Her name are Amy."
          ],
          "correct": "Her name is Amy."
        }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
