<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 4 - Lesson 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #2F4F2F;
    --accent: #6B8E23;
    --light-green: #F4F8F0;
    --green-border: #C8D8B9;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-green);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--dark);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--dark);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--accent);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--dark);
    color: #fff;
    border: 2px solid var(--dark);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--green-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-green);
    border: 2px solid var(--green-border);
    color: var(--dark);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--green-border);
  }

  .option-pill.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--green-border);
    border-radius: 10px;
    color: var(--dark);
    background: var(--light-green);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--dark);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--accent);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--dark);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 4 - Lesson 9</h1>
  <div class="instructions">Choose the correct answer for each question, then press "Check Answers".</div>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

<script>
const quizData = {
  "lesson": 9,
  "title": "Book 4 - Lesson 9",
  "sections": [
    {
      "name": "Sequencing & Result Words",
      "questions": [
        { "id": "q1", "type": "multiple_choice", "prompt": "Complete: 'First we had dinner. ___, we watched a movie.'", "options": ["So", "Worse", "Then", "Learnt"], "correct": "Then" },
        { "id": "q2", "type": "multiple_choice", "prompt": "Complete: 'It was raining hard, ___ we stayed home.'", "options": ["So", "Worse", "Then", "Came"], "correct": "So" },
        { "id": "q3", "type": "multiple_choice", "prompt": "Complete: 'My cold got ___ after I went out in the rain.'", "options": ["then", "so", "came", "worse"], "correct": "worse" }
      ]
    },
    {
      "name": "Irregular Past: Come & Learn",
      "questions": [
        { "id": "q4", "type": "multiple_choice", "prompt": "What is the past simple of 'come'?", "options": ["comed", "came", "coming", "comes"], "correct": "came" },
        { "id": "q5", "type": "multiple_choice", "prompt": "Complete: 'She ___ to my party last Saturday.'", "options": ["come", "coming", "came", "comes"], "correct": "came" },
        { "id": "q6", "type": "multiple_choice", "prompt": "What is the past simple of 'learn'?", "options": ["learnt", "learns", "learning", "learn"], "correct": "learnt" }
      ]
    },
    {
      "name": "Free Time & Sightseeing",
      "questions": [
        { "id": "q7", "type": "multiple_choice", "prompt": "What do we call the time when we are not working or studying?", "options": ["A view", "A trip", "Free will", "Free time"], "correct": "Free time" },
        { "id": "q8", "type": "multiple_choice", "prompt": "Complete: 'From the top of the hotel, we had a beautiful ___ of the city.'", "options": ["seem", "view", "get", "saw"], "correct": "view" },
        { "id": "q9", "type": "multiple_choice", "prompt": "Complete: 'I ___ a great documentary about space last night.'", "options": ["seem", "view", "saw", "get"], "correct": "saw" }
      ]
    },
    {
      "name": "European Cities",
      "questions": [
        { "id": "q10", "type": "multiple_choice", "prompt": "Which city is the capital of Italy?", "options": ["Rome", "Prague", "Europe", "London"], "correct": "Rome" },
        { "id": "q11", "type": "multiple_choice", "prompt": "Which city is in the Czech Republic?", "options": ["Rome", "Europe", "Paris", "Prague"], "correct": "Prague" },
        { "id": "q12", "type": "multiple_choice", "prompt": "Complete: 'Prague, Rome, and Lisbon are all cities in ___.'", "options": ["Asia", "Europe", "Africa", "America"], "correct": "Europe" }
      ]
    },
    {
      "name": "To Look vs. To Watch",
      "questions": [
        { "id": "q13", "type": "multiple_choice", "prompt": "Which verb do we use for something that stays still, like a painting?", "options": ["watch", "seem", "look", "get"], "correct": "look" },
        { "id": "q14", "type": "multiple_choice", "prompt": "Which verb do we use for something that moves, like a football match?", "options": ["watch", "look", "get", "seem"], "correct": "watch" },
        { "id": "q15", "type": "multiple_choice", "prompt": "Complete: 'I am ___ the dogs play outside.' (they are moving)", "options": ["looking at", "getting", "seeming", "watching"], "correct": "watching" }
      ]
    },
    {
      "name": "Get & Seem",
      "questions": [
        { "id": "q16", "type": "multiple_choice", "prompt": "Complete: 'It's ___ cold today - I need a jacket.' (becoming)", "options": ["seeming", "getting", "looking", "coming"], "correct": "getting" },
        { "id": "q17", "type": "multiple_choice", "prompt": "Complete: 'You ___ happy today! Did something good happen?' (appear to be)", "options": ["get", "watch", "seem", "look at"], "correct": "seem" },
        { "id": "q18", "type": "multiple_choice", "prompt": "Complete: 'After a long day of sightseeing, we ___ back to the hotel very tired.'", "options": ["came", "come", "coming", "comes"], "correct": "came" }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
