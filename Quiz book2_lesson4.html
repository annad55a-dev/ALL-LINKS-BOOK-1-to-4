<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 2 - Lesson 4 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #37016A;
    --blue: #6B3FA0;
    --light-blue: #F3EAFB;
    --blue-border: #C7A9E8;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--blue);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--navy);
    color: #fff;
    border: 2px solid var(--navy);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--blue-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-blue);
    border: 2px solid var(--blue-border);
    color: var(--navy);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--blue-border);
  }

  .option-pill.selected {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--blue-border);
    border-radius: 10px;
    color: var(--navy);
    background: var(--light-blue);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--blue);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--navy);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 2 - Lesson 4 Quiz</h1>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

        {

          "prompt": "What is the English phrase for 'Não ter' (he/she/it)?",

        }
      ]
    },
    {

      "questions": [
        {
          "id": "q5",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Quarto'?",

        {
          "id": "q6",
          "type": "fill_blank",

        },
        {
          "id": "q7",
          "type": "fill_blank",

        },
        {
          "id": "q10",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Terrível'?",

            "Terrible"

        {
          "id": "q11",

        }

    {

        {
          "id": "q14",

        },
        {
          "id": "q15",
          "type": "fill_blank",
          "prompt": "B: No, I ______.",
          "correct": [
            "haven't"

        },
        {
          "id": "q16",
          "type": "fill_blank",
          "prompt": "But I ______ got a bicycle.",
          "correct": [
            "have"
          ]
        },
        {
          "id": "q17",
          "type": "fill_blank",
          "prompt": "A: ______ your sister got a key to the house?",
          "correct": [
            "Has"
          ]
        },
        {
          "id": "q18",
          "type": "fill_blank",
          "prompt": "B: Yes, she ______.",
          "correct": [
            "has"
          ]
        },
        {
          "id": "q19",
          "type": "fill_blank",
          "prompt": "She ______ got a terrible pain in her back today, though.",
          "correct": [
            "has"
          ]
        },
        {
          "id": "q20",
          "type": "fill_blank",
          "prompt": "A: ______ they got a modern kitchen?",
          "correct": [
            "Have"
          ]
        },
        {
          "id": "q21",
          "type": "fill_blank",
          "prompt": "B: No, they ______.",
          "correct": [
            "haven't"
          ]
        }
      ]
    },
    {
      "name": "Age & Intelligence Vocabulary",
      "questions": [
        {
          "id": "q23",
          "type": "fill_blank",
          "prompt": "What is the English phrase for 'Quantos anos você tem?'?",
          "correct": [
            "How old are you?"
          ]
        },
        {
          "id": "q24",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Inteligente'?",
          "correct": [
            "Intelligent"
          ]
        }
      ]
    },
    {
      "name": "Reading: Text 3",
      "questions": [
        {
          "id": "q25",
          "type": "fill_blank",
          "prompt": "John's twelve years old. How old is John?",
          "correct": [
            "Twelve years old.",
            "twelve"
          ]
        },
        {
          "id": "q26",
          "type": "multiple_choice",
          "prompt": "He hasn't got a car. Has John got a car?",
          "options": [
            "Yes, he has.",
            "No, he hasn't."
          ],
          "correct": "No, he hasn't."
        },
        {
          "id": "q27",
          "type": "fill_blank",
          "prompt": "She's got a small red car. Describe Hannah's car.",
          "correct": [

            "small and red"
          ]
        },
        {
          "id": "q28",
          "type": "fill_blank",
          "prompt": "John hasn't got a key to his house. Hannah's got a key to her house. Who has got a key to their house?",
          "correct": [
            "Hannah.",

          ]
        },
        {
          "id": "q29",
          "type": "fill_blank",
          "prompt": "There are three bedrooms and two bathrooms in her flat. How many bedrooms and bathrooms are in Mrs Black's flat?",
          "correct": [
            "Three bedrooms and two bathrooms.",

            "three bedrooms and two bathrooms",
            "Three bedrooms and two bathrooms"
          ]
        }
      ]
    },
    {
      "name": "Is, Has, or Possessive?",
      "questions": [
        {
          "id": "q30",
          "type": "multiple_choice",
          "prompt": "Peter's got a headache. Does 's mean is, has, or possessive?",
          "options": [

            "has",
            "is"
          ],
          "correct": "has"
        },
        {
          "id": "q31",
          "type": "multiple_choice",
          "prompt": "The car's blue. Does 's mean is, has, or possessive?",
          "options": [
            "has",
            "possessive",
            "is"
          ],
          "correct": "is"
        },
        {
          "id": "q32",
          "type": "multiple_choice",
          "prompt": "Mrs Black's flat is beautiful. Does 's mean is, has, or possessive?",
          "options": [
            "has",
            "possessive",
            "is"
          ],
          "correct": "possessive"
        },
        {
          "id": "q33",
          "type": "multiple_choice",
          "prompt": "She's got a terrible pain. Does 's mean is, has, or possessive?",
          "options": [

        },
        {
          "id": "q34",

          "options": [

          ],
          "correct": "possessive"

        {
          "id": "q35",

          "prompt": "It's a modern bathroom. Does 's mean is, has, or possessive?",
          "options": [

            "has"

          "correct": "is"
        }
      ]
    },
    {
      "name": "Here, There, Bank & Plus",
      "questions": [
        {
          "id": "q39",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Mais'?",
          "correct": [
            "Plus"
          ]
        },
        {
          "id": "q36",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Aqui'?",
          "correct": [
            "Here"
          ]
        },
        {
          "id": "q37",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Ali / Lá'?",
          "correct": [
            "There"
          ]
        },
        {
          "id": "q38",
          "type": "fill_blank",
          "prompt": "What is the English word for 'Banco'?",
          "correct": [
            "Bank"
          ]
        }
      ]
    },
    {
      "name": "Money & Maths",
      "questions": [
        {
          "id": "q40",
          "type": "fill_blank",
          "prompt": "Ten plus five is ______.",
          "correct": [
            "fifteen"
          ]
        },
        {
          "id": "q41",
          "type": "fill_blank",
          "prompt": "Twenty plus three is ______.",
          "correct": [
            "twenty-three"
          ]
        },
        {
          "id": "q42",
          "type": "fill_blank",
          "prompt": "Ten plus twenty is ______.",
          "correct": [
            "thirty"
          ]
        },
        {
          "id": "q43",
          "type": "multiple_choice",
          "prompt": "Mary's got £2,000 in the bank. Is she rich or poor?",
          "options": [
            "Poor",
            "Rich"
          ],
          "correct": "Rich"
        },
        {
          "id": "q44",
          "type": "multiple_choice",
          "prompt": "Peter's got £3 in his wallet. Is he rich or poor?",
          "options": [
            "Poor",
            "Rich"
          ],
          "correct": "Poor"
        }
      ]
    },
    {
      "name": "Review",
      "questions": [
        {
          "id": "q45",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly uses 'have got' or 'has got'?",
          "options": [
            "She has got car a new.",
            "Has got she a new car.",
            "She has got a new car."
          ],
          "correct": "She has got a new car."
        },
        {
          "id": "q46",
          "type": "multiple_choice",
          "prompt": "Which sentence correctly uses possessive 's?",
          "options": [
            "That is Johns' car.",
            "That is John' car.",
            "That is John's car."
          ],
          "correct": "That is John's car."
        }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
