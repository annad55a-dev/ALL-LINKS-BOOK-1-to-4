<style>
  :root {
    --navy: #012169;
    --accent: #3D6D9E;
    --light: #EDF4FC;
    --border: #A9C7E8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Baloo 2', sans-serif;
    background: #fff;
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--navy);

    color: var(--navy);
    font-weight: 700;
    font-size: 1.3rem;
    margin-bottom: 20px;

    background: var(--light);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
  }

    font-weight: 700;
    font-size: 1rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--navy);
    display: inline-flex;
    align-items: center;
    gap: 8px;

  button.play-btn svg { width: 18px; height: 18px; fill: #fff; }

    width: 100%;
    max-width: 360px;
    accent-color: var(--navy);
