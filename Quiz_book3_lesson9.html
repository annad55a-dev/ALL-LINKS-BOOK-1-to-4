<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book 3 - Lesson 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #8A6100;
    --gold: #E0A800;
    --light-yellow: #FFF9E6;
    --yellow-border: #F2D488;
    --correct-fg: #2E7D32;
    --correct-bg: #E8F5E9;
    --incorrect-fg: #C62828;
    --incorrect-bg: #FDECEA;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-yellow);
    margin: 0;
    padding: 24px 16px 60px;
    color: var(--dark);
  }

  .quiz-container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    color: var(--dark);
    font-weight: 700;
    font-size: 2rem;
    margin-bottom: 8px;
  }

  .instructions {
    text-align: center;
    color: var(--gold);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .section {
    margin-bottom: 32px;
  }

  .section-label {
    display: inline-block;
    background: var(--dark);
    color: #fff;
    border: 2px solid var(--dark);
    border-radius: 999px;
    padding: 6px 18px;
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }

  .question {
    background: #fff;
    border: 2px solid var(--yellow-border);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 14px;
  }

  .prompt {
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 12px;
    font-size: 1.05rem;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .option-pill {
    font-family: 'Baloo 2', sans-serif;
    background: var(--light-yellow);
    border: 2px solid var(--yellow-border);
    color: var(--dark);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .option-pill:hover {
    background: var(--yellow-border);
  }

  .option-pill.selected {
    background: var(--gold);
    color: #fff;
    border-color: var(--gold);
  }

  .option-pill.correct {
    background: var(--correct-bg);
    color: var(--correct-fg);
    border-color: var(--correct-fg);
  }

  .option-pill.incorrect {
    background: var(--incorrect-bg);
    color: var(--incorrect-fg);
    border-color: var(--incorrect-fg);
  }

  .fill-blank-input {
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    max-width: 320px;
    padding: 10px 14px;
    font-size: 1rem;
    border: 2px solid var(--yellow-border);
    border-radius: 10px;
    color: var(--dark);
    background: var(--light-yellow);
  }

  .fill-blank-input.correct {
    background: var(--correct-bg);
    border-color: var(--correct-fg);
    color: var(--correct-fg);
  }

  .fill-blank-input.incorrect {
    background: var(--incorrect-bg);
    border-color: var(--incorrect-fg);
    color: var(--incorrect-fg);
  }

  .feedback-icon {
    margin-left: 8px;
    font-weight: 700;
  }

  .feedback-icon.correct { color: var(--correct-fg); }
  .feedback-icon.incorrect { color: var(--incorrect-fg); }

  .controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 32px;
  }

  button.action-btn {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px 32px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    color: #fff;
    background: var(--dark);
  }

  button.action-btn:hover {
    opacity: 0.9;
  }

  button.reset-btn {
    background: var(--gold);
  }

  #score-summary {
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    margin-top: 24px;
    color: var(--dark);
  }
</style>
</head>
<body>

<div class="quiz-container">
  <h1>Book 3 - Lesson 9</h1>
  <div class="instructions">Choose the correct answer for each question, then press "Check Answers".</div>

  <div id="quiz-body"></div>

  <div class="controls">
    <button class="action-btn" id="check-btn">Check Answers</button>
    <button class="action-btn reset-btn" id="reset-btn">Reset</button>
  </div>

  <div id="score-summary"></div>
</div>

<script>
const quizData = {
  "lesson": 9,
  "title": "Book 3 - Lesson 9",
  "sections": [
    {
      "name": "Where Do You Go? (Places in Town)",
      "questions": [
        { "id": "q1", "type": "multiple_choice", "prompt": "You want to buy stamps and send a letter. Where do you go?", "options": ["Museum", "Post office", "Shopping centre", "Park"], "correct": "Post office" },
        { "id": "q2", "type": "multiple_choice", "prompt": "You want to see old paintings and interesting objects from history. Where do you go?", "options": ["Train station", "Airport", "Museum", "Shop"], "correct": "Museum" },
        { "id": "q3", "type": "multiple_choice", "prompt": "You need to catch a plane for your holiday. Where do you go?", "options": ["Train station", "Post office", "Park", "Airport"], "correct": "Airport" }
      ]
    },
    {
      "name": "Odd One Out",
      "questions": [
        { "id": "q4", "type": "multiple_choice", "prompt": "Which word is the odd one out?", "options": ["Buy", "Sell", "Shop", "Near"], "correct": "Near" },
        { "id": "q5", "type": "multiple_choice", "prompt": "Which word is the odd one out?", "options": ["Sauce", "Museum", "Parks", "Historical sites"], "correct": "Sauce" },
        { "id": "q6", "type": "multiple_choice", "prompt": "Which word is the odd one out?", "options": ["Airport", "Chocolate", "Train station", "Shopping centre"], "correct": "Chocolate" }
      ]
    },
    {
      "name": "True or False",
      "questions": [
        { "id": "q7", "type": "multiple_choice", "prompt": "True or False: 'EITHER...OR' is used to talk about two choices.", "options": ["False", "True"], "correct": "True" },
        { "id": "q8", "type": "multiple_choice", "prompt": "True or False: 'PORK' is the meat that comes from cows.", "options": ["True", "False"], "correct": "False" },
        { "id": "q9", "type": "multiple_choice", "prompt": "True or False: 'FAR' means close to something.", "options": ["False", "True"], "correct": "False" }
      ]
    },
    {
      "name": "Complete the Conversation",
      "questions": [
        { "id": "q10", "type": "multiple_choice", "prompt": "'Excuse me, is the train station near here?' - '___'", "options": ["Yes, I prefer chocolate.", "No, it's very far - about 20 minutes by car.", "No, I don't sell tickets.", "Yes, at the beginning of the street."], "correct": "No, it's very far - about 20 minutes by car." },
        { "id": "q11", "type": "multiple_choice", "prompt": "'What kind of meat do you want, pork or beef?' - '___'", "options": ["I'm going to the post office.", "It's in the middle of the park.", "I prefer beef, please.", "I come into the shop every day."], "correct": "I prefer beef, please." },
        { "id": "q12", "type": "multiple_choice", "prompt": "'When does the shop close?' - '___'", "options": ["It's near the airport.", "I sell shoes and bags.", "It's a historical site.", "It's open until 9pm."], "correct": "It's open until 9pm." }
      ]
    },
    {
      "name": "Position & Location Phrases",
      "questions": [
        { "id": "q13", "type": "multiple_choice", "prompt": "Complete the sentence: 'The bathroom is ___ the house, between the kitchen and the bedroom.'", "options": ["at the beginning of", "in the middle of", "at the end of", "until"], "correct": "in the middle of" },
        { "id": "q14", "type": "multiple_choice", "prompt": "Complete the sentence: 'Please stay ___ the film to see the bonus scene.'", "options": ["at the beginning of", "in the middle of", "early", "after/post credit"], "correct": "after/post credit" },
        { "id": "q15", "type": "multiple_choice", "prompt": "Complete the sentence: 'The shop opens ___ , so get there before everyone else.'", "options": ["late", "until", "early", "far"], "correct": "early" }
      ]
    },
    {
      "name": "Describing Towns & Timing",
      "questions": [
        { "id": "q16", "type": "multiple_choice", "prompt": "Which phrase describes a town that is next to the ocean?", "options": ["Lake town", "By the sea", "Far", "Near"], "correct": "By the sea" },
        { "id": "q17", "type": "multiple_choice", "prompt": "Which phrase describes a small town close to a lake?", "options": ["Lake town", "By the sea", "Historical sites", "Shopping centre"], "correct": "Lake town" },
        { "id": "q18", "type": "multiple_choice", "prompt": "Complete the sentence: 'The shop is open ___ 6 o'clock, so we still have time.'", "options": ["early", "late", "until", "either"], "correct": "until" }
      ]
    }
  ]
};

const userAnswers = {};

function renderQuiz() {
  const body = document.getElementById('quiz-body');
  body.innerHTML = '';

  quizData.sections.forEach(section => {
    const sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';

    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = section.name;
    sectionDiv.appendChild(label);

    section.questions.forEach(q => {
      const qDiv = document.createElement('div');
      qDiv.className = 'question';
      qDiv.id = 'question-' + q.id;

      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.textContent = q.prompt;
      qDiv.appendChild(prompt);

      if (q.type === 'multiple_choice') {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';
        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-pill';
          btn.textContent = opt;
          btn.type = 'button';
          btn.addEventListener('click', () => {
            userAnswers[q.id] = opt;
            optionsDiv.querySelectorAll('.option-pill').forEach(p => p.classList.remove('selected'));
            btn.classList.add('selected');
          });
          optionsDiv.appendChild(btn);
        });
        qDiv.appendChild(optionsDiv);
      } else if (q.type === 'fill_blank') {
        const input = document.createElement('input');
        input.className = 'fill-blank-input';
        input.type = 'text';
        input.id = 'input-' + q.id;
        input.addEventListener('input', () => {
          userAnswers[q.id] = input.value;
        });
        qDiv.appendChild(input);
      }

      sectionDiv.appendChild(qDiv);
    });

    body.appendChild(sectionDiv);
  });
}

function checkAnswers() {
  let correctCount = 0;
  let totalCount = 0;

  quizData.sections.forEach(section => {
    section.questions.forEach(q => {
      totalCount++;
      const qDiv = document.getElementById('question-' + q.id);

      if (q.type === 'multiple_choice') {
        const pills = qDiv.querySelectorAll('.option-pill');
        const userAnswer = userAnswers[q.id];
        const isCorrect = userAnswer === q.correct;
        if (isCorrect) correctCount++;

        pills.forEach(pill => {
          pill.classList.remove('selected');
          if (pill.textContent === q.correct) {
            pill.classList.add('correct');
          } else if (pill.textContent === userAnswer && !isCorrect) {
            pill.classList.add('incorrect');
          }
          pill.disabled = true;
        });
      } else if (q.type === 'fill_blank') {
        const input = document.getElementById('input-' + q.id);
        const userAnswer = (userAnswers[q.id] || '').trim().toLowerCase();
        const isCorrect = q.correct.some(c => c.trim().toLowerCase() === userAnswer);
        if (isCorrect) correctCount++;

        input.classList.add(isCorrect ? 'correct' : 'incorrect');
        input.disabled = true;

        if (!isCorrect) {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon incorrect';
          hint.textContent = ' ✗ (' + q.correct[0] + ')';
          input.parentNode.appendChild(hint);
        } else {
          const hint = document.createElement('span');
          hint.className = 'feedback-icon correct';
          hint.textContent = ' ✓';
          input.parentNode.appendChild(hint);
        }
      }
    });
  });

  document.getElementById('score-summary').textContent = 'Score: ' + correctCount + ' / ' + totalCount;
}

document.getElementById('check-btn').addEventListener('click', checkAnswers);
document.getElementById('reset-btn').addEventListener('click', () => location.reload());

renderQuiz();
</script>

</body>
</html>
